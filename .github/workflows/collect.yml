name: Collect daily digest

on:
  schedule:
    - cron: "1 21 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Дата YYYY-MM-DD для поста в Telegram. Пусто — день этой сборки, в том числе повторно."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      day_files: ${{ steps.commit.outputs.day_files }}
      dates: ${{ steps.collect_run.outputs.dates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r agent/requirements.txt

      - name: Collect
        id: collect_run
        run: python agent/run.py

      - name: Commit day JSON
        id: commit
        run: |
          git config user.name "ones-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days data/index.json data/sources.json agent/state
          files=$(git diff --cached --name-only -- data/days | paste -sd, -)
          echo "day_files=$files" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "No digest changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add digest for yesterday"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Write report summary
        if: always()
        run: node tests/ci-summary.js

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [collect, test]
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.sha }}

      - name: Prepare site folder
        run: |
          mkdir _site
          cp index.html about.html settings.html privacy.html CNAME PROJECT.md README.md favicon.svg favicon_600.png _site/
          cp -r css js data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  telegram:
    needs: [collect, test, deploy]
    if: >-
      always() &&
      needs.collect.result == 'success' &&
      needs.test.result == 'success' &&
      (
        needs.deploy.result == 'success' ||
        needs.deploy.result == 'skipped' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.post_date != '')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r agent/requirements.txt

      - name: Test telegram formatter
        working-directory: agent
        run: python -m unittest test_telegram_post

      - name: Post digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAY_FILES: ${{ needs.collect.outputs.day_files }}
          COLLECTED_DATES: ${{ needs.collect.outputs.dates }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          args=()
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$DAY_FILES" ]; then
            IFS=',' read -ra files <<< "$DAY_FILES"
            for file in "${files[@]}"; do
              [ -z "$file" ] && continue
              base="${file##*/}"
              args+=(--date "${base%.json}")
            done
          fi
          if [ -n "$POST_DATE" ]; then
            args+=(--date "$POST_DATE")
          fi
          if [ ${#args[@]} -eq 0 ] && [ -n "$COLLECTED_DATES" ]; then
            IFS=',' read -ra days <<< "$COLLECTED_DATES"
            for day in "${days[@]}"; do
              [ -z "$day" ] && continue
              if [ -f "data/days/${day}.json" ]; then
                args+=(--date "$day")
              fi
            done
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "No dates to post"
            exit 0
          fi
          python agent/telegram_post.py "${args[@]}"
