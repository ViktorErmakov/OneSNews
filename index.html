<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OneS News</title>
		<meta
			name="description"
			content="Ежедневный дайджест новостей вокруг мира 1С — в первую очередь для разработчиков."
		/>
		<meta name="color-scheme" content="light dark" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('ones-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-theme', t);
					var cs = document.querySelector('meta[name="color-scheme"]');
					if (cs) cs.setAttribute('content', t);
				} catch (e) {}
			})();
		</script>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<a class="skip-link" href="#main">К содержанию</a>

		<div class="chrome">
			<header class="top">
				<div class="shell top-inner">
					<a class="brand" href="index.html">
						<svg
							class="brand-mark"
							viewBox="0 0 64 64"
							width="38"
							height="38"
							aria-hidden="true"
							focusable="false"
						>
							<g
								fill="none"
								stroke-width="3.1"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<rect
									x="2.4"
									y="2.4"
									width="59.2"
									height="59.2"
									rx="13"
									fill="none"
									stroke-width="2.6"
								/>
								<path
									fill="none"
									d="M23.5 11.62h5.33a2.2 2.2 0 0 1 2.2 2.2v36.53a2.2 2.2 0 0 1-2.2 2.2h-5.33a2.2 2.2 0 0 1-2.2-2.2V24.45l-5.9-1.25q-2.07-.45-2.07-2.35v-1.3q0-1.7 1.45-2.8L21.3 12.2a2.2 2.2 0 0 1 2.2-.58z"
								/>
								<path fill="none" d="M37.73 23.24A11.83 11.83 0 0 1 38.7 41.97" />
								<path fill="none" d="M39.84 13.88A21.26 21.26 0 0 1 43.81 50.3" />
							</g>
						</svg>
						<span class="brand-text">
							<span class="brand-name">OneS News</span>
							<span class="brand-sub">enterprisehub.dev</span>
						</span>
					</a>
					<nav class="top-nav" aria-label="Оформление">
						<div class="picker picker-compact" id="lang-picker">
							<button
								type="button"
								class="picker-btn"
								id="lang-picker-btn"
								aria-haspopup="listbox"
								aria-expanded="false"
								aria-controls="lang-picker-list"
								aria-label="Язык"
							></button>
							<ul
								class="picker-list"
								id="lang-picker-list"
								role="listbox"
								aria-label="Язык"
								hidden
							></ul>
						</div>
						<button
							type="button"
							class="theme-toggle"
							id="theme-toggle"
							aria-pressed="false"
							aria-label="Включить тёмную тему"
						>
							<span class="theme-toggle-track" aria-hidden="true">
								<svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24">
									<circle cx="12" cy="12" r="4" />
									<path
										d="M12 3v1.5M12 19.5V21M4.9 4.9l1.1 1.1M18 18l1.1 1.1M3 12h1.5M19.5 12H21M4.9 19.1l1.1-1.1M18 6l1.1-1.1"
									/>
								</svg>
								<svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24">
									<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" />
								</svg>
								<span class="theme-toggle-thumb"></span>
							</span>
						</button>
					</nav>
				</div>
			</header>

			<div class="filters-bar">
				<div class="shell filters-inner">
					<div class="filters-row">
						<div class="picker" id="date-picker">
							<button
								type="button"
								class="picker-btn"
								id="date-picker-btn"
								aria-haspopup="dialog"
								aria-expanded="false"
								aria-controls="date-picker-panel"
								aria-label="Дата"
							></button>
							<div
								class="picker-panel calendar-panel"
								id="date-picker-panel"
								role="dialog"
								aria-label="Календарь"
								hidden
							></div>
						</div>
						<div class="picker" id="dir-picker">
							<button
								type="button"
								class="picker-btn"
								id="dir-picker-btn"
								aria-haspopup="listbox"
								aria-expanded="false"
								aria-controls="dir-picker-list"
								aria-label="Тема"
							></button>
							<ul
								class="picker-list"
								id="dir-picker-list"
								role="listbox"
								aria-label="Тема"
								hidden
							></ul>
						</div>
					</div>
					<div class="search-row" id="search-box" role="search">
						<div class="search-field">
							<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="10.5" cy="10.5" r="6.5" />
								<path d="M15.5 15.5 L20 20" />
							</svg>
							<input
								type="search"
								id="feed-search"
								name="q"
								placeholder="Поиск по заголовкам и описаниям"
								autocomplete="off"
								enterkeyhint="search"
								aria-label="Поиск по заголовкам и описаниям"
								aria-autocomplete="list"
								aria-controls="search-history"
								aria-expanded="false"
							/>
							<button
								type="button"
								class="search-clear"
								id="search-clear"
								hidden
								aria-label="Сбросить поиск"
							>
								×
							</button>
						</div>
						<ul
							class="search-history"
							id="search-history"
							role="listbox"
							aria-label="Недавние запросы"
							hidden
						></ul>
					</div>
				</div>
			</div>
		</div>

		<main id="main" class="shell">
			<p id="status" class="status" hidden></p>
			<header class="day-hero">
				<div class="day-hero-row">
					<h1 id="day-title">Загрузка…</h1>
					<p id="day-count" class="day-count" hidden></p>
				</div>
				<nav id="section-nav" class="section-nav" aria-label="Разделы дня" hidden></nav>
			</header>
			<div id="feed" class="feed"></div>
		</main>

		<footer class="footer">
			<div class="shell footer-inner">
				<nav class="footer-nav" aria-label="О сайте">
					<a href="about.html">О проекте</a>
					<a href="mailto:mopdeus@gmail.com?subject=OneS%20News">Пожелания</a>
				</nav>
				<p>© OneS News</p>
			</div>
		</footer>

		<script src="js/theme.js"></script>
		<script src="js/config.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
