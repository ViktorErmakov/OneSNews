# Источники для сборщика (браузер этот файл не читает).
# Секции совпадают с блоками на сайте: site / telegram / video.
#
# language: ru | en
# fetch: rss | telegram_web | youtube_rss | infostart
# url: адрес для сборщика (RSS / t.me/s / …)
# home: публичная страница источника для about.html
# summarize: false — писать RSS/анонс сразу в day JSON; true (по умолчанию) — саммари через Gemini

site:
  - name: "Habr 1C"
    url: "https://habr.com/ru/rss/hub/1c/all/?fl=ru"
    home: "https://habr.com/ru/hubs/1c/"
    fetch: rss
    language: ru
    enabled: true
    summarize: false
  - name: "Infostart"
    url: "https://infostart.ru/public/rss/"
    home: "https://infostart.ru/"
    fetch: infostart
    language: ru
    enabled: true
    summarize: false

telegram:
  - name: "example_dev1c"
    url: "https://t.me/s/example_dev1c"
    home: "https://t.me/example_dev1c"
    fetch: telegram_web
    language: ru
    enabled: false
    summarize: true

video:
  - name: "Example YouTube"
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=CHANNEL_ID"
    home: "https://www.youtube.com/channel/CHANNEL_ID"
    fetch: youtube_rss
    language: ru
    enabled: false
    summarize: true
